<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VivaSE — apoio do pitch</title>
<style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#211526;color:#fff}*{box-sizing:border-box}body{margin:0}header,nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px}header{border-bottom:1px solid #62416d}h1{font-size:18px;margin:0}header p{font-size:13px;margin:4px 0;color:#e6d3eb}button{font:inherit;color:inherit;background:#80378b;border:1px solid #bf8cc6;border-radius:6px;padding:10px 18px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #ffe129;outline-offset:3px}figure{margin:0 auto;max-width:1440px}img{display:block;width:100%;height:calc(100dvh - 165px);object-fit:contain;background:#171119}figcaption{padding:10px 24px;font-size:15px}figure[hidden]{display:none}nav{padding-top:0}#count{color:#ffe129}small{color:#e6d3eb}@media print{header,nav{display:none}figure[hidden],figure{display:block!important;break-after:page}img{height:auto}body{background:#fff;color:#000}}
</style></head><body>
<header><div><h1>VivaSE · encontrar, conhecer e guardar</h1><p>Capturas reais do protótipo em 19/11/2026 · apoio local, sem interação com o mapa.</p></div><small>← → para navegar</small></header>
<main>
<figure><img src="01-inicio.jpg" alt="Home do VivaSE com identidade FASC e fotografia do festival"><figcaption>1. A cidade é o festival — o problema e a proposta.</figcaption></figure>
<figure hidden><img src="02-orientacao.jpg" alt="Mapa real carregado com espaços individuais e detalhe do palco João Bebe Água"><figcaption>2. Orientação — mapa, lugar, imagem e referência aproximada.</figcaption></figure>
<figure hidden><img src="03-programacao.jpg" alt="Programação do sábado filtrada pela apresentação de Morgana"><figcaption>3. Programação — busca, detalhes e seleção pessoal no navegador.</figcaption></figure>
<figure hidden><img src="04-cultura.jpg" alt="Roteiro cultural com paradas e acompanhamento do percurso"><figcaption>4. Descoberta — explorar a cidade por roteiros culturais.</figcaption></figure>
<figure hidden><img src="05-historia.jpg" alt="Máquina do tempo na edição de 2025 com agenda histórica documentada"><figcaption>5. História — edições, participações e fontes; acervo parcial.</figcaption></figure>
<figure hidden><img src="06-memorias.jpg" alt="Área de memórias com relatos identificados e formulário de lembrança local"><figcaption>6. Memória — lembranças no próprio aparelho; sem publicação compartilhada.</figcaption></figure>
</main><nav aria-label="Telas do apoio"><button id="prev" disabled>← Anterior</button><span id="count" aria-live="polite">1 / 6</span><button id="next">Próxima →</button></nav>
<script>
const slides=[...document.querySelectorAll('figure')],prev=document.querySelector('#prev'),next=document.querySelector('#next'),count=document.querySelector('#count');let index=0;
function show(n){index=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.hidden=i!==index);prev.disabled=index===0;next.disabled=index===slides.length-1;count.textContent=`${index+1} / ${slides.length}`}
prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();show(index+(e.key==='ArrowRight'?1:-1))}});
</script></body></html>
